[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-comparison"
version = "1.0.0"
description = "A Comparative Study of Self-Supervised Learning Methods using a Common ResNet-18 Backbone"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

authors = [
    { name = "Saif Nizami" }
]

keywords = [
    "self-supervised-learning",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "simclr",
    "byol",
    "vicreg",
    "barlow-twins",
    "lejepa",
    "representation-learning"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",

    "lightly==1.5.21",

    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",

    "opencv-python==4.11.0.86",
    "Pillow==11.2.1",

    "scikit-learn==1.6.1",

    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "plotly==6.1.2",

    "tqdm==4.67.1",

    "PyYAML==6.0.2",
    "omegaconf==2.3.0",

    "tensorboard==2.19.0",

    "rich==14.0.0",
    "tabulate==0.9.0",
    "colorama==0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "black==25.1.0",
    "isort==6.0.1",
    "flake8==7.2.0",
    "jupyter==1.1.1",
    "ipykernel==6.29.5"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true